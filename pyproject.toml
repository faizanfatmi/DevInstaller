[project]
name = "devinstaller"
version = "1.0.5"
description = "DevInstaller — cross-platform developer tool installer with premium Qt GUI"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Faizan Fatmi", email = "faizanfatmi@users.noreply.github.com"}
]
dependencies = [
    "PySide6>=6.6.0",
]

[project.scripts]
devinstaller = "udm.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/udm"]

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
