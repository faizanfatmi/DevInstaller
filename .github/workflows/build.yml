name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build Windows executable
        run: uv run python scripts/build_exe.py

      - name: Sign Windows executable
        if: env.SIGN_CERT_PFX != ''
        env:
          SIGN_CERT_PFX: ${{ secrets.SIGN_CERT_PFX }}
          SIGN_CERT_PASS: ${{ secrets.SIGN_CERT_PASS }}
        shell: pwsh
        run: |
          # Decode PFX from base64 secret
          $pfxBytes = [Convert]::FromBase64String($env:SIGN_CERT_PFX)
          $pfxPath  = Join-Path $env:RUNNER_TEMP "code_signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

          # Locate signtool from Windows SDK
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
                      Where-Object { $_.FullName -match "x64" } |
                      Sort-Object FullName -Descending |
                      Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) { Write-Error "signtool.exe not found"; exit 1 }

          # Sign each exe
          Get-ChildItem dist\*.exe | ForEach-Object {
            Write-Host "Signing $($_.Name)..."
            & $signtool sign /f $pfxPath /p $env:SIGN_CERT_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Universal Dev Manager" $_.FullName
            if ($LASTEXITCODE -ne 0) { Write-Error "Signing failed for $($_.Name)"; exit 1 }
            Write-Host "Skipping verify as self-signed certificates require root store installation."
          }

          # Clean up
          Remove-Item $pfxPath -Force

      - uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0 fuse libfuse2 \
            libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-image0 libxcb-randr0 libxcb-render-util0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0 libtiff5 || sudo apt-get install -y libtiff6

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build AppImage
        run: uv run bash scripts/build_appimage.sh

      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build DMG
        run: uv run bash scripts/build_dmg.sh

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.head_commit.message, 'release:')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Determine Tag Name
        id: determine_tag
        run: |
          # Single source of truth for the version: meson.build. The build
          # scripts sync this same value into the binary (scripts/sync_version.py),
          # so deriving the release tag from meson.build too guarantees the tag
          # always equals the version baked into the download. Mismatched sources
          # were what made freshly-downloaded builds nag "update available".
          MESON_VERSION=$(grep -oE "^[[:space:]]*version:[[:space:]]*'[^']+'" meson.build | head -1 | sed -E "s/.*'([^']+)'.*/\1/")
          if [ -z "$MESON_VERSION" ]; then
            echo "::error::Could not read the project version from meson.build"
            exit 1
          fi

          # Guard: if this release was triggered by a "release: X" commit, that X
          # must match meson.build — otherwise the tag and the binary would drift.
          MSG="${{ github.event.head_commit.message }}"
          if [[ "$MSG" =~ ^release:[[:space:]]*([0-9][0-9A-Za-z.\-]*) ]]; then
            MSG_VERSION="${BASH_REMATCH[1]}"
            if [ "$MSG_VERSION" != "$MESON_VERSION" ]; then
              echo "::error::Release commit declares $MSG_VERSION but meson.build is $MESON_VERSION. Bump meson.build (and run scripts/sync_version.py) so the release tag matches the version compiled into the binary."
              exit 1
            fi
          fi

          # Guard: a manually pushed tag must also match meson.build.
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_FROM_REF="${GITHUB_REF#refs/tags/}"
            if [ "$TAG_FROM_REF" != "v$MESON_VERSION" ]; then
              echo "::error::Pushed tag $TAG_FROM_REF does not match meson.build v$MESON_VERSION."
              exit 1
            fi
          fi

          echo "TAG_NAME=v$MESON_VERSION" >> $GITHUB_ENV

      - name: Generate Changelog
        id: changelog
        run: |
          git fetch --tags --quiet
          CURRENT_TAG="${{ env.TAG_NAME }}"
          PREV_TAG=$(git describe --tags --abbrev=0 --exclude="$CURRENT_TAG" HEAD 2>/dev/null || echo "")
          
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "### Changes in this release:" >> $GITHUB_ENV
          if [ -z "$PREV_TAG" ]; then
            git log --pretty=format:"- %s (%h)" >> $GITHUB_ENV
          else
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" >> $GITHUB_ENV
          fi
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          body: |
            ${{ github.event.head_commit.message }}
            
            ${{ env.CHANGELOG }}
          files: |
            artifacts/windows-exe/*
            artifacts/linux-appimage/*
            artifacts/macos-dmg/*
